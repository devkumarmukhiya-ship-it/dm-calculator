
// Always sign the debug APK with the fixed key stored in the repo (debug.keystore),
// so every new build can be installed over the old one.
android {
    signingConfigs {
        debug {
            storeFile rootProject.file("../debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
}
