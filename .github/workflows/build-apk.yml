name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Use root index.html as the app page
        run: |
          mkdir -p www
          cp index.html www/index.html
          # stamp the About screen with this build's version and time (Nepal time)
          sed -i "s/__APP_VERSION__/1.${{ github.run_number }}/g" www/index.html
          sed -i "s|__BUILD_TIME__|$(TZ=Asia/Kathmandu date '+%d %b %Y, %I:%M %p') (Nepal time)|g" www/index.html
          grep -o 'id="about-[a-z]*">[^<]*' www/index.html

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Add native print and save helper
        run: cp native/MainActivity.java "$(find android/app/src/main/java -name MainActivity.java | head -1)"

      - name: Make launcher icons from native/icon-source.png
        run: |
          python3 -c "import PIL" 2>/dev/null || python3 -m pip install --break-system-packages pillow
          python3 native/make_icons.py native/icon-source.png android/app/src/main/res

      - name: Sync web files
        run: npx cap sync android

      - name: Use fixed signing key and bump versionCode
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          cat native/signing.gradle >> android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DevkumarMukhiyaCalculator.apk

      - name: Show signing fingerprint (must be 1D:E6:B1:70... every build)
        run: keytool -printcert -jarfile DevkumarMukhiyaCalculator.apk | grep SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: DevkumarMukhiyaCalculator.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Calculator v${{ github.run_number }}
          files: DevkumarMukhiyaCalculator.apk
